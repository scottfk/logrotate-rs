[package]
name = "logrotate-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/scottfk/logrotate-rs"
description = "Drop-in Rust port of logrotate"
rust-version = "1.88"

[[bin]]
name = "logrotate"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
